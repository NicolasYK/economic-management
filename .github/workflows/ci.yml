name: CI
on:
  push:
    branches: ['main', 'codex/**', 'dev']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Linux graphics build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev xvfb
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - name: Package Windows debug binary
        if: runner.os == 'Windows'
        run: python scripts/package.py windows --binary target/debug/economic-management.exe
      - name: Windows packaged graphical smoke test
        if: runner.os == 'Windows'
        run: python scripts/smoke_package.py
      - name: Native graphical smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a target/debug/economic-management --data-dir qa-output/smoke --smoke-test
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit
