name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python scripts/release_notes.py
      - name: Validate release channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/codex/technical-design
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package: linux
          - os: windows-latest
            package: windows
          - os: macos-15
            package: macos
    runs-on: ${{ matrix.os }}
    env:
      BUILD_COMMIT: ${{ github.sha }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev xvfb
      - run: rustup show
      - run: python scripts/release_notes.py
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit
      - run: cargo build --release --locked
      - name: Native graphical smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a target/release/economic-management --data-dir qa-output/smoke --smoke-test
      - run: python scripts/package.py ${{ matrix.package }}
      - name: Extract and launch native ZIP
        if: runner.os != 'Linux'
        run: python scripts/smoke_package.py
      - name: AppImage smoke test without FUSE
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x dist/*.AppImage
          xvfb-run -a dist/*.AppImage --appimage-extract-and-run --data-dir qa-output/appimage --smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.AppImage dist/*.sha256 --verify-tag --title "Economic Management $RELEASE_TAG" --notes-file dist/release-notes.md "${flags[@]}"
